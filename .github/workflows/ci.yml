name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run starter:list

  smoke:
    runs-on: ubuntu-latest
    needs: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run template:init
      - run: npm run starter:create fhe-counter -- --dir ci-smoke --skip-ui
      - name: Test generated project (FHEVM mock)
        working-directory: workspace/ci-smoke
        run: |
          npm install --no-audit --no-fund
          npx hardhat test
